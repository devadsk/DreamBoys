<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Check Categories in Firebase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
            text-align: center;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin: 1rem 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 10px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .result h3 {
            margin-bottom: 1rem;
        }

        .result ul {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .result li {
            margin: 0.5rem 0;
        }

        .category-item {
            background: #f8f9fa;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Check Categories in Firebase</h1>
        <p style="color: #666; margin-bottom: 1rem;">
            This tool will check if categories exist in your Firebase database.
        </p>

        <label for="config" style="font-weight: 600; color: #333;">
            Paste your Firebase config from <code>src/firebase/config.js</code>:
        </label>
        <textarea id="config" rows="8" placeholder="Paste your Firebase config here..."></textarea>

        <button onclick="checkCategories()">🔍 Check Categories</button>

        <div id="result" class="result"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        window.checkCategories = async function () {
            const configInput = document.getElementById('config');
            const resultDiv = document.getElementById('result');

            try {
                // Parse config
                const configText = configInput.value.trim();
                if (!configText) {
                    throw new Error('Please paste your Firebase config');
                }

                const cleanConfig = configText
                    .replace(/export\s+const\s+firebaseConfig\s*=\s*/, '')
                    .replace(/;?\s*$/, '');
                const config = eval('(' + cleanConfig + ')');

                // Initialize Firebase
                const app = initializeApp(config, 'check-app-' + Date.now());
                const db = getFirestore(app);

                resultDiv.className = 'result';
                resultDiv.innerHTML = '<p>⏳ Checking Firebase database...</p>';
                resultDiv.classList.add('show');

                // Try to get categories
                const querySnapshot = await getDocs(collection(db, 'categories'));

                if (querySnapshot.empty) {
                    resultDiv.className = 'result error show';
                    resultDiv.innerHTML = `
                        <h3>❌ No Categories Found!</h3>
                        <p>The database query succeeded, but no categories were found.</p>
                        <p><strong>This means:</strong></p>
                        <ul>
                            <li>✅ Your Firebase config is correct</li>
                            <li>✅ Security rules allow reading</li>
                            <li>❌ But categories collection is empty or doesn't exist</li>
                        </ul>
                        <p><strong>Solution:</strong></p>
                        <ol>
                            <li>Go to Firebase Console → Firestore Database</li>
                            <li>Check if "categories" collection exists</li>
                            <li>If not, the add-categories.html tool failed to add them</li>
                            <li>Make sure security rules are deployed (allow create: if isAdmin())</li>
                            <li>Make sure your user has role: "admin" in the users collection</li>
                        </ol>
                    `;
                } else {
                    let html = '<h3>✅ Categories Found!</h3>';
                    html += `<p>Found <strong>${querySnapshot.size}</strong> categories in Firebase:</p>`;

                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        html += `
                            <div class="category-item">
                                <strong>${data.image} ${data.name}</strong><br>
                                <small>Link: ${data.link}</small><br>
                                <small>Color: ${data.color}</small><br>
                                <small>Visible: ${data.visible !== false ? '✅ Yes' : '❌ No'}</small>
                            </div>
                        `;
                    });

                    html += `
                        <p style="margin-top: 1rem;"><strong>✅ Categories exist in Firebase!</strong></p>
                        <p><strong>If they're not showing in your admin panel:</strong></p>
                        <ol>
                            <li>Open browser console (F12) on your admin page</li>
                            <li>Look for any error messages</li>
                            <li>Make sure you're using the same Firebase project</li>
                            <li>Try refreshing the admin page</li>
                        </ol>
                    `;

                    resultDiv.className = 'result success show';
                    resultDiv.innerHTML = html;
                }

            } catch (error) {
                resultDiv.className = 'result error show';

                let errorMsg = error.message;
                let solution = '';

                if (errorMsg.includes('permission') || errorMsg.includes('insufficient')) {
                    solution = `
                        <p><strong>This is a SECURITY RULES issue!</strong></p>
                        <ol>
                            <li>Go to Firebase Console → Firestore Database → Rules</li>
                            <li>Make sure you have this rule:
                                <pre style="background: #f5f5f5; padding: 0.5rem; margin: 0.5rem 0; border-radius: 5px;">
match /categories/{categoryId} {
  allow read: if true;
  allow create, update, delete: if isAdmin();
}</pre>
                            </li>
                            <li>Click "Publish"</li>
                            <li>Wait 30 seconds and try again</li>
                        </ol>
                    `;
                } else if (errorMsg.includes('network') || errorMsg.includes('fetch')) {
                    solution = '<p><strong>Network error:</strong> Check your internet connection and Firebase project status.</p>';
                } else {
                    solution = `
                        <p><strong>Possible issues:</strong></p>
                        <ul>
                            <li>Invalid Firebase config format</li>
                            <li>Wrong project selected</li>
                            <li>Firebase project doesn't exist</li>
                        </ul>
                    `;
                }

                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p><strong>Error message:</strong> ${errorMsg}</p>
                    ${solution}
                `;
            }
        };
    </script>
</body>

</html>
